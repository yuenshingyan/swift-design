[workspace]
resolver = "3"
members = ["crates/design-model", "crates/server", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
design-model = { path = "crates/design-model" }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "2.0"
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
