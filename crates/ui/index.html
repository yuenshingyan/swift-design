<!DOCTYPE html>
<html>
  <head>
    <!-- dx writes the title from Dioxus.toml into this element. -->
    <title></title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <!--
      The tab icon. The server serves both files from `assets/`. Safari
      reads neither a `data:` URI nor an SVG icon, so the ICO comes
      first and every browser can read it. A browser that prefers the
      SVG takes the second link.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
